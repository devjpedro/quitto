<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1B18" media="(prefers-color-scheme: dark)">
<title>Quitto</title>
<style>
:root{--bg:#F1F0EB;--ink:#111111;--muted:#62625D;--brand:#1F5A32;--trk:rgba(31,90,50,.22);--raise:#FFFFFF;--btn:#111111;--on-btn:#FFFFFF}
:root.dark{--bg:#1A1B18;--ink:#ECEBE6;--muted:#9A9A92;--brand:#7CC495;--trk:rgba(124,196,149,.22);--raise:#242521;--btn:#ECEBE6;--on-btn:#151613}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{height:60px;display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top);flex:none}
.wm{height:23.3px;width:64.8px;display:block;color:var(--brand)}
.wm .t{stroke:var(--trk)}
.wm .a{stroke:var(--brand)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px 96px}
.ico{width:72px;height:72px;border-radius:50%;background:var(--raise);position:relative;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;width:72px;height:72px}
.ring circle{fill:none;stroke:var(--trk);stroke-width:2.2}
.wifi{width:28px;height:28px;fill:var(--brand);position:relative}
h1{font-size:24px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin-top:20px}
p{font-size:15px;line-height:1.5;color:var(--muted);margin-top:8px;max-width:290px}
button{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--btn);color:var(--on-btn);font:500 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button svg{width:18px;height:18px;fill:currentColor}
</style>
</head>
<body>

<p id="d">O Quitto precisa da internet para mostrar seus contratos.</p>

</main>
<script>
(function () {
  // Static page served by the service worker: it reads the same cookies as the app
  // (theme, locale); with none, the system's dark mode and the browser's language.
  function cookie(name) {
    var m = document.cookie.match(new RegExp("(?:^|;\\s*)" + name + "=([^;]*)"));
    return m ? m[1] : null;
  }
  var theme = cookie("theme");
  var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  if (dark) document.documentElement.classList.add("dark");
  var loc = cookie("locale") || navigator.language || "pt-BR";
  var en = /^en/i.test(loc);
  if (en) {
    document.documentElement.lang = "en-US";
    document.getElementById("t").textContent = "You're offline";
    document.getElementById("d").textContent = "Quitto needs the internet to show your contracts.";
    document.getElementById("l").textContent = "Try again";
  }
  document.getElementById("b").addEventListener("click", function () { location.reload(); });
  addEventListener("online", function () { location.reload(); });
})();
</script>

</html>
