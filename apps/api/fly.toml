app = "usequitto-api"
primary_region = "gru"
kill_timeout = "10s"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "get"
  path = "/api/ping"
  interval = "30s"
  timeout = "5s"

[http_service.concurrency]
  type = "requests"
  soft_limit = 50
  hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
