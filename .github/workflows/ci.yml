name: CI
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quitto
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio12345
          MINIO_DEFAULT_BUCKETS: quitto-proofs
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quitto
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: quitto-proofs
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quitto/api db:migrate
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
  e2e-shard:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: quitto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio12345
          MINIO_DEFAULT_BUCKETS: quitto-proofs
        ports: ["9000:9000"]
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/quitto
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3001
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: quitto-proofs
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quitto/api db:migrate
      # O E2E roda contra o build de produção do web (sem compilar rota a rota
      # como o dev server); o /api dele é proxiado pra API local, na :3000.
      - name: build do web (node-server)
        run: bun run --filter @quitto/web build
        env:
          NITRO_PRESET: node-server
          QUITTO_API_PROXY: http://localhost:3000
      - id: playwright
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: cd e2e && bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: cd e2e && bunx playwright install-deps chromium
      - run: cd e2e && bun run e2e --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: e2e/playwright-report
  # Check obrigatório da main: o nome "e2e" tem que continuar existindo. Um job
  # pulado conta como verde, então o resultado do matrix é conferido de forma
  # explícita.
  e2e:
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: todos os shards passaram
        run: |
          echo "e2e-shard: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"
  migrate:
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - name: drizzle migrate (Neon prod)
        run: bun run --filter @quitto/api db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BETTER_AUTH_SECRET: migrate-placeholder-32-characters-minimo
          BETTER_AUTH_URL: https://usequitto.vercel.app
          WEB_ORIGIN: https://usequitto.vercel.app
  deploy-api:
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (API)
        run: flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  deploy-web:
    # Depois da API: o web novo lê campos que só a API nova manda (ex.: o /home
    # da Fase 1.5), e subir antes derruba o shell até o fly terminar. A API só
    # cresce, então o web antigo com a API nova não quebra.
    needs: [migrate, deploy-api]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Força o preset do Nitro: dentro do GitHub Actions a autodetecção (std-env)
      # vê "GitHub Actions" antes de "Vercel" e gera .output/ em vez de .vercel/output/.
      NITRO_PRESET: vercel
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: npm install --global vercel@62.1.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
  smoke:
    needs: [deploy-api, deploy-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: API health
        run: curl --fail --silent --show-error https://usequitto-api.fly.dev/api/ping
      # /login é público e renderizado no SSR (a função da Vercel responde de
      # verdade); `/` anônimo é só um 307 e passaria mesmo com o front quebrado.
      - name: Web up (SSR)
        run: curl --fail --silent --show-error -o /dev/null https://usequitto.vercel.app/login
