name: reminders
permissions: {}
on:
  schedule:
    - cron: "0 12 * * *" # 09:00 BRT
  workflow_dispatch:
concurrency:
  group: reminders
  cancel-in-progress: false
jobs:
  sweep:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispara a varredura de lembretes na API (Fly)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://usequitto-api.fly.dev/api/internal/cron/reminders
